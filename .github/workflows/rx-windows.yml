name: Reader experiment - Windows app

# Builds Send to Daylight for Windows (Tauri), tests it end to end on the runner against the mock relay (installer,
# pairing links with their confirmation, Send to, the clipboard hotkey's path, acks, restarts, an update, uninstall),
# checks the window's page for accessibility and Lab-off parity in Chromium, then publishes
# Send-to-Daylight-windows-setup.exe to the "reader-experiment-latest" release. Unsigned for now: SmartScreen warns on
# first run.
#
# Lanes (LAB-PLAN 6.1): this file belongs to the win lane; every job carries a "# lane: win" comment.
#
# Lab release gate (LAB-PLAN 6.2): the Windows Lab build reaches the release only after the iPhone and Mac builds of
# the same wave. reader-experiment/windows/lab-wave.json names the Lab wave of the code (null before any Lab code);
# while reader-experiment/lab-release-gate.json has that wave false, the build is tested but not uploaded, and the log
# says so. Flipping the gate starts this workflow, which then publishes the held build.
on:
  push:
    branches: [claude/sweet-goldberg-ej1nb0]
    paths:
      - 'reader-experiment/windows/**'
      - 'reader-experiment/share/js/**'
      - '!reader-experiment/share/**/*.md'
      - 'reader-experiment/lab-release-gate.json'
      - '.github/workflows/rx-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

# Runs queue rather than cancel, so a release upload is never cut off half way.
concurrency:
  group: rx-windows
  cancel-in-progress: false

jobs:
  # lane: win
  app:
    name: Build, test end to end
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: reader-experiment/windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reader-experiment/windows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: reader-experiment/windows/src-tauri -> target

      - name: Install the Tauri CLI
        run: npm ci

      - name: Build the frontend (copies in ../share/js/daylight-share.js)
        run: node build.mjs

      - name: Unit tests (frontend, against the mock relay)
        run: node --test test/unit/*.test.mjs

      - name: Unit tests (Rust argument parsing, atomic writes)
        working-directory: reader-experiment/windows/src-tauri
        run: |
          mkdir -p target
          rustc --edition 2021 --test src/args.rs -o target/args-test.exe
          ./target/args-test.exe
          rustc --edition 2021 --test src/atomic.rs -o target/atomic-test.exe
          ./target/atomic-test.exe

      - name: Build the app and the installer (NSIS)
        # The CLI's JavaScript entry point, so the JSON reaches it without a trip through cmd.exe.
        run: node node_modules/@tauri-apps/cli/tauri.js build --bundles nsis --config "{\"version\":\"1.1.${GITHUB_RUN_NUMBER}\"}"

      - name: Collect Send-to-Daylight-windows-setup.exe and the bare exe
        run: |
          mkdir -p out
          ls -la src-tauri/target/release/bundle/nsis
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/Send-to-Daylight-windows-setup.exe
          cp src-tauri/target/release/send-to-daylight.exe out/send-to-daylight.exe
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Send-to-Daylight-windows-setup
          path: reader-experiment/windows/out/Send-to-Daylight-windows-setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: send-to-daylight-exe
          path: reader-experiment/windows/out/send-to-daylight.exe
          if-no-files-found: error

      - name: End-to-end test (install, pairing links, Send to, clipboard hotkey, Delivered, restarts, update, uninstall) against the mock relay
        run: node test/e2e/windows.e2e.mjs --installer out/Send-to-Daylight-windows-setup.exe

      - name: Keep the end-to-end output (status file, summary, screenshot)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rx-windows-e2e-results
          path: reader-experiment/windows/test-results
          if-no-files-found: ignore

  # lane: win
  # The window's page (dist/index.html) in Chromium, WebView2's engine, with a fake bridge in place of Rust and Windows'
  # own fonts: axe-core, no text cut short at the narrowest window with Comfort, announcements (LAB-PLAN F27), and the
  # Lab-off parity baselines (1.7).
  ui:
    name: Window accessibility and Lab-off parity
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: reader-experiment/windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reader-experiment/windows/package-lock.json

      - name: Install Playwright and axe-core
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Build the frontend
        run: node build.mjs

      - name: Accessibility (axe-core, F27.4 at the narrowest window, announcements) and Lab-off parity
        run: node --test --test-concurrency=1 test/ui/*.test.mjs

      - name: Keep the accessibility screenshots (F27.4, for review)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rx-windows-a11y-screenshots
          path: reader-experiment/windows/test-results/a11y
          if-no-files-found: ignore

  # lane: win
  publish:
    name: Publish to the release
    needs: [app, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            reader-experiment/lab-release-gate.json
            reader-experiment/windows/lab-wave.json
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: Send-to-Daylight-windows-setup
          path: out

      - name: Check the Lab release gate (LAB-PLAN 6.2)
        id: gate
        run: |
          set -euo pipefail
          gate=reader-experiment/lab-release-gate.json
          wave=$(jq -r '.wave // ""' reader-experiment/windows/lab-wave.json)
          if [ -z "$wave" ]; then
            echo "Windows app: no Lab code in this build (wave none in reader-experiment/windows/lab-wave.json): publishing the installer."
            echo "open=true" >> "$GITHUB_OUTPUT"
          elif [ "$(jq -r --arg w "$wave" '.[$w] == true' "$gate")" = true ]; then
            echo "Windows app: Lab wave $wave is open in $gate: publishing the installer."
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Lab release gate::Windows app: NOT publishing Send-to-Daylight-windows-setup.exe. Its Lab wave $wave waits for the iPhone and Mac builds of that wave ($gate has \"$wave\": false). The tests ran."
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Send-to-Daylight-windows-setup.exe to the release
        if: steps.gate.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/rx-publish.sh out/Send-to-Daylight-windows-setup.exe
