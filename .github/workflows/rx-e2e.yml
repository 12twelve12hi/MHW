name: Reader experiment - end to end on an emulator

# Builds the Daylight Reader from its public source snapshot (a12k-a2b/daylight-reader, with x86_64 added for the
# emulator) and checks, on an Android 14 emulator, that what the Daylight Inbox hands over lands in the Reader's library:
# a phone (e2e/sender.mjs, protocol 1.1) sends through the mock relay with ntfy.sh's limits; pages, links, PDFs, a 5 MB
# PDF in parts, two PDFs 20 s apart while the Reader is in front, and Documents = Ask (card and notification taps) and
# batch. Lab (LAB-PLAN F17, E0): the phone reads the Inbox's Lab frames (sender.mjs wait-lab): the hello and the states
# of a page, a link and a PDF; waiting then handed with Documents = Ask and a root tap; a link waiting without the
# overlay permission; the Inbox's Lab off and on (a page, a link and a PDF with no state); and the v1.0 and v1.1
# Senders as they shipped (share/js/test/fixtures, E2E_PEER) on the same pairing, each sending a page, a link and a PDF,
# unchanged (F17.1). Lab Wave 1 (E1): every action of an arrival notice to its state (F15: Add to Reader, Keep for
# later, a swipe, Dismiss), an excerpt and a note as new documents (F11), the Reader hand-off test (F26), and the same
# Daylight Share as the phone on that pairing: an NYT headline + link from the share sheet goes as a link (F11.5, Q1),
# the Direct Share shortcut is listed (F08), a forced 413 gives the send worker's notice (F04.6) and Send as excerpt
# goes as an excerpt; the Lab frames stay within the Inbox's daily cap. The sender job checks the phone's commands
# against the JS reference Daylight first. Screenshots and logs: the e2e-screens artifact.
# This workflow publishes nothing, so the Lab release gate (lab-release-gate.json) does not apply.
on:
  push:
    branches: [claude/sweet-goldberg-ej1nb0]
    paths:
      - 'reader-experiment/e2e/**'
      - 'reader-experiment/android/**'
      - 'reader-experiment/share/**'
      - '!reader-experiment/share/**/*.md'
      - '.github/workflows/rx-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

# One emulator run at a time. A run in progress is not cancelled by a newer push (several sessions push to this branch,
# and a cancelled run proves nothing); the newest push waits and runs next.
concurrency:
  group: rx-e2e
  cancel-in-progress: false

jobs:
  # lane: e2e
  sender:
    name: The e2e phone's Lab commands (no emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: sender.mjs lab-states, wait-lab, status, send-excerpt and await-share, and the v1.0 and v1.1 phones, against the JS reference Daylight (LabInbox) on the mock relay
        run: node --test reader-experiment/e2e/sender-lab.test.mjs

  # lane: e2e
  reader:
    name: Build the Reader snapshot
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        run: echo "sha=$(git ls-remote https://github.com/a12k-a2b/daylight-reader HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: reader-apk
          key: reader-snapshot-x86-${{ steps.sha.outputs.sha }}-v1
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: a12k-a2b/daylight-reader
          path: reader
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v4
      - name: SDK packages the Reader needs
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.5" >/dev/null
      - name: Add x86_64 to the ABI filters (the emulator's ABI; the PDFium build ships x64 too)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: reader
        run: |
          grep -rl 'abiFilters += "arm64-v8a"' --include=build.gradle.kts . | xargs sed -i 's/abiFilters += "arm64-v8a"/abiFilters += listOf("arm64-v8a", "x86_64")/'
          git diff --stat
      - name: Build the debug APK
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: reader
        run: |
          ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx5g --max-workers=4 :app:assembleDebug
          mkdir -p ../reader-apk && cp app/build/outputs/apk/debug/*.apk ../reader-apk/reader-snapshot-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: reader-snapshot-debug
          path: reader-apk/

  # lane: e2e
  share:
    name: Build Daylight Share (debug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reader-experiment/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the debug APK (it has the adb setup link and cleartext to the emulator's host)
        run: |
          ./gradlew --no-daemon :app:assembleDebug
          mkdir -p ../../share-apk && cp app/build/outputs/apk/debug/app-debug.apk ../../share-apk/daylight-share-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: daylight-share-debug-for-e2e
          path: share-apk/

  # lane: e2e
  emulator:
    name: Reader and Inbox on an emulator
    needs: [reader, share]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: reader-snapshot-debug
          path: reader-apk
      - uses: actions/download-artifact@v4
        with:
          name: daylight-share-debug-for-e2e
          path: share-apk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reader smoke test, then the Inbox end to end
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            bash reader-experiment/e2e/reader-smoke.sh reader-apk e2e-out
            bash reader-experiment/e2e/inbox-e2e.sh share-apk/daylight-share-debug.apk e2e-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screens
          path: e2e-out/
