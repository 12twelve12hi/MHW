name: Reader experiment - end to end on an emulator

# Builds the Daylight Reader from its public source snapshot (a12k-a2b/daylight-reader, with x86_64 added for the
# emulator) and checks, on an Android 14 emulator, that what the Daylight Inbox hands over lands in the Reader's library.
on:
  push:
    branches: [claude/sweet-goldberg-ej1nb0]
    paths:
      - 'reader-experiment/e2e/**'
      - '.github/workflows/rx-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rx-e2e
  cancel-in-progress: true

jobs:
  reader:
    name: Build the Reader snapshot
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        run: echo "sha=$(git ls-remote https://github.com/a12k-a2b/daylight-reader HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: reader-apk
          key: reader-snapshot-x86-${{ steps.sha.outputs.sha }}-v1
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: a12k-a2b/daylight-reader
          path: reader
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v4
      - name: SDK packages the Reader needs
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.5" >/dev/null
      - name: Add x86_64 to the ABI filters (the emulator's ABI; the PDFium build ships x64 too)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: reader
        run: |
          grep -rl 'abiFilters += "arm64-v8a"' --include=build.gradle.kts . | xargs sed -i 's/abiFilters += "arm64-v8a"/abiFilters += listOf("arm64-v8a", "x86_64")/'
          git diff --stat
      - name: Build the debug APK
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: reader
        run: |
          ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx5g --max-workers=4 :app:assembleDebug
          mkdir -p ../reader-apk && cp app/build/outputs/apk/debug/*.apk ../reader-apk/reader-snapshot-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: reader-snapshot-debug
          path: reader-apk/

  emulator:
    name: Reader on an emulator
    needs: reader
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: reader-snapshot-debug
          path: reader-apk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reader smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash reader-experiment/e2e/reader-smoke.sh reader-apk e2e-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screens
          path: e2e-out/
