name: Reader experiment - share protocol

# Tests the Daylight Share protocol's JavaScript reference implementation, its Lab additions (LAB-PROTOCOL.md) and their
# vectors, the version-skew suite and the household soak, then does a live round trip through https://ntfy.sh to prove
# the relay behaves as the protocol assumes.
on:
  push:
    branches: [claude/sweet-goldberg-ej1nb0]
    paths:
      - 'reader-experiment/share/**'
      - '!reader-experiment/share/**/*.md'
      # lab.test.mjs runs labGate against the server lane's client module (F00.6), so a change there runs this too
      - 'reader-experiment/server/client/**'
      - '.github/workflows/rx-share.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'   # daily: catch relay behaviour changes

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reader-experiment/share
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vectors are up to date
        run: |
          cp vectors/test-vectors.json /tmp/committed.json
          node vectors/generate.mjs
          # deflate output can differ between zlib builds, so compare everything except the frames that hold it
          node -e '
            const a = require("/tmp/committed.json"), b = require("./vectors/test-vectors.json");
            const strip = (v) => ({ ...v, items: v.items.map((i) => ({ name: i.name, expect: i.expect })) });
            if (JSON.stringify(strip(a)) !== JSON.stringify(strip(b))) { console.error("test-vectors.json is stale: run node vectors/generate.mjs"); process.exit(1); }
          '
          cp /tmp/committed.json vectors/test-vectors.json
      - name: Lab vectors are up to date
        # lab-vectors.json has no deflate output, so it must regenerate byte for byte
        run: |
          node vectors/generate-lab.mjs
          git diff --exit-code -- vectors/lab-vectors.json || { echo "lab-vectors.json is stale: run node vectors/generate-lab.mjs"; exit 1; }
      - name: Unit, mock-relay, Lab, skew and soak tests
        run: node --test js/test/*.test.mjs 2>&1 | tee /tmp/test.log; test "${PIPESTATUS[0]}" -eq 0
      - name: Household soak summary
        if: always()
        run: grep -h '\[soak ' /tmp/test.log | sed 's/^# //' >> "$GITHUB_STEP_SUMMARY" || true
      - name: Live round trip through ntfy.sh
        run: node js/live-ntfy.mjs https://ntfy.sh
