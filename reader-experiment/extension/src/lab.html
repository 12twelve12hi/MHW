<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Send to Daylight</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="lab-page.js"></script>
</head>
<!-- Lab settings (LAB-PLAN 1.1, 1.4, 2.6): the popup's "What's in Lab ›" and "Daylight server ›" open this page in a
     tab, at #whats-in-lab and #server. Its first view (#lab) is the Lab switch with the same two rows. With Lab off,
     only the switch and its footer show, whatever the address says (1.3). Every word is LAB_TEXT's (lab-ui.js fills
     the views) or the server module's; ‹ Back is the popup's own. -->
<body>
  <main id="app" aria-busy="true">
    <header class="top">
      <img class="mark" src="icons/icon-32.png" alt="" width="22" height="22">
      <h1>Send to Daylight</h1>
    </header>

    <section id="view-lab" hidden aria-labelledby="lab-h">
      <h2 id="lab-h">Lab</h2>
      <div class="switch-row">
        <label for="lab" class="switch-label">Lab</label>
        <input id="lab" class="switch" type="checkbox" role="switch" aria-describedby="lab-footer">
      </div>
      <div id="lab-rows" class="nav-rows" hidden>
        <button id="open-whats-in-lab" class="nav-row" type="button"><span class="nav-text"><span class="nav-label">What’s in Lab</span></span><span class="chev" aria-hidden="true">›</span></button>
        <button id="open-server" class="nav-row" type="button"><span class="nav-text"><span class="nav-label">Daylight server</span><span id="server-sub" class="nav-sub"></span></span><span class="chev" aria-hidden="true">›</span></button>
      </div>
      <p id="lab-footer" class="hint small switch-footer">New features we’re trying out. Turn Lab off for the plain app; nothing you sent is lost.</p>
    </section>

    <section id="view-whats-in-lab" hidden aria-labelledby="whats-h">
      <button class="back" type="button" data-back>‹ Back</button>
      <h2 id="whats-h">What’s in Lab</h2>
      <div id="whats"></div>
    </section>

    <section id="view-server" hidden aria-labelledby="server-h">
      <button class="back" type="button" data-back>‹ Back</button>
      <h2 id="server-h" tabindex="-1">Daylight server</h2>
      <div id="server"></div>
    </section>
  </main>
</body>
</html>
